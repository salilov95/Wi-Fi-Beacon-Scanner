# Версия 2.x на Rust (папка rust/): формат, clippy, тесты, сверка с эталонами contract/golden и с API 1.x,
# сборка окна (Tauri 2) и установщика для Windows.
# Запускается только когда меняются rust/, contract/, интерфейс (он зашит в exe 2.x) или этот файл - сборку
# и релизы 1.x (ci.yml, release.yml) не трогает. Итог каждого шага пишется аннотацией (::notice / ::error),
# чтобы его было видно без логов.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "contract/**"
      - "wifi_beacon_scanner/web/static/**"
      - "tools/compare_state.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "contract/**"
      - "wifi_beacon_scanner/web/static/**"
      - "tools/compare_state.py"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.0"   # точная версия Rust; в rust/rust-toolchain.toml - канал stable
  CARGO_TERM_COLOR: never

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          echo "::notice title=rust ${{ matrix.os }}::$(rustc --version)"
      - name: fmt, clippy, tests
        run: |
          fail=0
          step() {
            local name="$1"; shift
            if "$@" > "/tmp/$name.log" 2>&1; then
              echo "::notice title=$name ${{ matrix.os }}::ok"
            else
              fail=1
              echo "::error title=$name ${{ matrix.os }}::$(tail -c 3500 "/tmp/$name.log" | tr '\n' '|' | sed 's/%/%25/g')"
            fi
            cat "/tmp/$name.log"
          }
          step fmt cargo fmt --all --check
          step clippy cargo clippy --all-targets -- -D warnings
          step tests cargo test -- --nocapture
          if [ -f /tmp/tests.log ]; then
            summary=$(grep -E "^test result|проверено строк" /tmp/tests.log | tr '\n' '|')
            echo "::notice title=tests summary ${{ matrix.os }}::$summary"
          fi
          # API 2.x против 1.x (Python): /api/state, выгрузки CSV и JSON
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            step devserver cargo build --example devserver
            step compare_state python3 ../tools/compare_state.py target/debug/examples/devserver
            echo "::notice title=compare_state::$(tail -n 1 /tmp/compare_state.log)"
          fi
          exit $fail

  app:
    # Окно 2.x (Tauri 2): exe и установщик NSIS для Windows. Скан пока только на Windows.
    # Черновик pre-release v<версия> с файлами для проверки: только для веток этого репозитория, не публикуется
    # (опубликовать - решение владельца). Прошлый черновик той же версии заменяется.
    needs: core
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: rust/app
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          echo "::notice title=rust app::$(rustc --version), node $(node --version)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/app/target
          key: app-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('rust/app/Cargo.toml') }}
          restore-keys: app-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      # База вендоров (колонка «Вендор»), как в release.yml. Не скачалась - собираем без неё.
      - name: Vendor database (optional)
        continue-on-error: true
        shell: pwsh
        run: Invoke-WebRequest https://www.wireshark.org/download/automated/data/manuf -OutFile "$env:RUNNER_TEMP/manuf"
      - name: fmt, clippy, build, installer
        env:
          WBS_MANUF: ${{ runner.temp }}/manuf
        run: |
          fail=0
          step() {
            local name="$1"; shift
            if "$@" > "/tmp/$name.log" 2>&1; then
              echo "::notice title=$name app::ok"
            else
              fail=1
              # первая ошибка компилятора важнее хвоста лога
              local msg
              msg=$(grep -E -A14 "^error" "/tmp/$name.log" | head -c 3500)
              [ -z "$msg" ] && msg=$(tail -c 3500 "/tmp/$name.log")
              echo "::error title=$name app::$(echo "$msg" | tr '\n' '|' | sed 's/%/%25/g')"
            fi
            cat "/tmp/$name.log"
          }
          step fmt cargo fmt --check
          step clippy cargo clippy --release -- -D warnings
          step bundle npx --yes @tauri-apps/cli@2 build --ci
          [ $fail = 0 ] || exit 1
          v=$(grep -m1 '"version"' tauri.conf.json | sed -E 's/.*"([^"]+)",?/\1/')
          mkdir -p ../../dist2
          cp target/release/wbs-app.exe ../../dist2/WiFiBeaconScanner2.exe
          cp target/release/bundle/nsis/*-setup.exe "../../dist2/WiFiBeaconScanner2-Setup-$v.exe"
          (cd ../../dist2 && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "::notice title=bundle::$(npx --yes @tauri-apps/cli@2 --version), $(cd ../../dist2 && ls -l *.exe | awk '{print $9" "$5}' | tr '\n' ' ')"
          echo "::notice title=crates::$(grep -A1 -E '^name = "(tauri|tauri-build|wry|tao)"$' Cargo.lock | tr -d '\n' | sed 's/--/  /g')"
      # Запуск собранного exe: окно должно открыться и запросить у программы состояние
      # (в журнале «окно подключилось»). Wi-Fi на runner нет - ошибки скана здесь ожидаемы.
      - name: Smoke test (window opens and talks to the core)
        continue-on-error: true
        run: |
          ../../dist2/WiFiBeaconScanner2.exe &
          pid=$!
          log="$LOCALAPPDATA/WiFiBeaconScanner2/logs/app.log"
          ok=0
          for i in $(seq 1 40); do
            sleep 1
            if grep -q "окно подключилось" "$log" 2>/dev/null; then ok=1; break; fi
          done
          kill $pid 2>/dev/null || taskkill //F //IM WiFiBeaconScanner2.exe || true
          echo "::notice title=smoke log::$(tr '\n' '|' < "$log" 2>/dev/null | head -c 3000)"
          if [ $ok = 1 ]; then echo "::notice title=smoke::окно открылось и подключилось к ядру"; else echo "::error title=smoke::окно не подключилось за 40 с"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiBeaconScanner2
          path: dist2/*
          if-no-files-found: error
      - name: Draft pre-release (not published)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: dist2
        run: |
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then gh release delete "$tag" --yes; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice title=draft::$tag уже опубликован - черновик не создаю"; exit 0
          fi
          cat > notes.md <<EOF
          **Альфа-версия 2.x на Rust + Tauri 2 - для проверки.** Рабочая версия - 1.x, она ставится и работает рядом, эта сборка её не трогает.

          Что есть: скан через Windows Native Wifi API, таблица сетей, каналы, обзор, загрузка каналов, сигнал во времени, проблемы, Beacon (дерево IE), сравнение «до/после», «Мои SSID», выгрузка CSV/JSON. Результаты разбора и правил совпадают с 1.x на эталонах (contract/).

          Чего пока нет (есть в 1.x): журнал подключения и сессии, журнал Windows, обход с планом этажа, отчёты HTML/PDF/Excel, проверка обновлений.

          - \`WiFiBeaconScanner2-Setup-$VERSION.exe\` - установщик (для текущего пользователя, без прав администратора);
          - \`WiFiBeaconScanner2.exe\` - переносная версия (нужен WebView2, в Windows 11 он есть).

          Файлы не подписаны: SmartScreen покажет предупреждение («Подробнее» → «Выполнить в любом случае»).
          Настройки: %APPDATA%\\WiFiBeaconScanner2, журнал: %LOCALAPPDATA%\\WiFiBeaconScanner2\\logs\\app.log.

          Сборка: ${SHA:0:7}
          EOF
          gh release create "$tag" WiFiBeaconScanner2-Setup-*.exe WiFiBeaconScanner2.exe SHA256SUMS.txt \
            --draft --prerelease --target "$SHA" --title "Wi-Fi Beacon Scanner $tag (черновик)" --notes-file notes.md
          echo "::notice title=draft::черновик $tag создан (не опубликован)"
