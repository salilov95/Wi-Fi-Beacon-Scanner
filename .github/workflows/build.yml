# Сборка на Windows в GitHub Actions: тесты, переносной WifiDiag.exe и установщик WifiDiag-Setup-<версия>.exe.
# Запуск: вручную (Actions → build → Run workflow) или тегом версии: git tag v0.6.0 && git push origin v0.6.0.
# По тегу файлы прикладываются к GitHub Release; при ручном запуске лежат в артефакте сборки.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests on Windows
        run: python -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches version in wifi_diag/__init__.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import wifi_diag; print(wifi_diag.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $v" }

      # База вендоров (колонка «Вендор»). Не скачалась - собираем без неё, программа это переживёт.
      - name: Vendor database (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wifi_diag/data | Out-Null
          Invoke-WebRequest https://www.wireshark.org/download/automated/data/manuf -OutFile wifi_diag/data/manuf

      - name: Inno Setup 6
        shell: pwsh
        run: choco upgrade innosetup --no-progress -y

      - name: Build portable exe and installer
        shell: cmd
        env:
          PY: python
        run: |
          call build.bat || exit /b 1
          call build_installer.bat || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: WifiDiag
          path: |
            dist/installer/*.exe
            dist/WifiDiag.exe
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $setup dist/WifiDiag.exe --title "WifiDiag ${{ github.ref_name }}" --generate-notes
