# Тесты при каждом push и pull request: Windows (целевая система) и Linux (самая старая и самая новая Python).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"     # кириллица в выводе Python на Windows

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Dev dependencies (only for tests)
        run: python -m pip install openpyxl
      - name: Unit tests
        run: python tools/run_tests.py
      - name: PDF through Microsoft Edge (Windows)
        if: runner.os == 'Windows'
        run: python -c "import time; from wifi_beacon_scanner import pdf; t=time.time(); d=pdf.html_to_pdf('<h1>Проверка печати</h1>'); assert d.startswith(b'%PDF'); print('::notice title=PDF::Edge напечатал %d байт за %.1f с (%s)' % (len(d), time.time()-t, pdf.find_browser()))"
