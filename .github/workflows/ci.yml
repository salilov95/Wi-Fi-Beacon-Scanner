# Тесты при каждом push и pull request: Windows (целевая система) и Linux (самая старая и самая новая Python).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dev dependencies (only for tests)
        run: python -m pip install openpyxl
      - name: Unit tests
        run: python -m unittest discover -s tests -v
