# Ветка 1.x: исправления версии 1.x (Python). Основная версия с 2.0.0 - 2.x в main; релиз 1.x
# публикуется с --latest=false, «последним» остаётся 2.x, и проверка обновлений 1.x показывает 2.x.
# Сборка WiFiBeaconScanner.exe (переносной) и WiFiBeaconScanner-Setup-<версия>.exe (установщик) на Windows.
#   - Actions → Release → Run workflow с галочкой «publish»: сборка + GitHub Release v<версия из __init__.py>,
#     тег создаётся на собранном коммите;
#   - тег версии (git tag v0.7.0 && git push origin v0.7.0): то же самое;
#   - Run workflow без галочки: только сборка, файлы лежат в артефакте запуска.
name: Release 1.x

on:
  push:
    tags: ["v1.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать GitHub Release v<версия из wifi_beacon_scanner/__init__.py>"
        type: boolean
        default: false
      draft:
        description: "Черновик: собрать и выложить черновой pre-release для проверки (не публикуется)"
        type: boolean
        default: false

env:
  PYTHONUTF8: "1"     # кириллица в выводе Python на Windows

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version and tag
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import wifi_beacon_scanner; print(wifi_beacon_scanner.__version__)"
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $v" }
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.publish }}" -eq "true" -or "${{ inputs.draft }}" -eq "true") {
            $tag = "v$v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version $v, release tag '$tag'"

      - name: Unit tests
        run: |
          python -m pip install openpyxl
          python tools/run_tests.py

      # База вендоров (колонка «Вендор»). Не скачалась - собираем без неё, программа это переживёт.
      - name: Vendor database (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wifi_beacon_scanner/data | Out-Null
          Invoke-WebRequest https://www.wireshark.org/download/automated/data/manuf -OutFile wifi_beacon_scanner/data/manuf

      - name: Inno Setup 6
        shell: pwsh
        run: choco upgrade innosetup --no-progress -y

      - name: Build portable exe and installer
        shell: cmd
        env:
          PY: python
        run: |
          call build.bat || exit /b 1
          call build_installer.bat || exit /b 1

      - name: Smoke test of the built exe (start, scan, PDF and Excel export)
        run: python tools/smoke_exe.py dist\WiFiBeaconScanner\WiFiBeaconScanner.exe

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/installer/*.exe) + @(Get-Item dist/WiFiBeaconScanner.exe)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiBeaconScanner
          path: |
            dist/installer/*.exe
            dist/WiFiBeaconScanner.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: GitHub Release
        if: steps.ver.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $setup = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          python tools/release_notes.py ${{ steps.ver.outputs.version }} --setup (Split-Path $setup -Leaf) --out release-notes.md
          if ("${{ inputs.draft }}" -eq "true") {
            # прошлый черновик этой версии заменяем новым
            $old = gh release view $tag --json isDraft -q .isDraft 2>$null
            if ($old -eq "true") { gh release delete $tag --yes }
            gh release create $tag $setup dist/WiFiBeaconScanner.exe dist/SHA256SUMS.txt --draft --prerelease --target "${{ github.sha }}" --title "Wi-Fi Beacon Scanner $tag (черновик, ${{ github.ref_name }})" --notes-file release-notes.md
          } else {
            # черновик этой же версии больше не нужен: публикуем настоящий релиз
            $old = gh release view $tag --json isDraft -q .isDraft 2>$null
            if ($old -eq "true") { gh release delete $tag --yes }
            gh release create $tag $setup dist/WiFiBeaconScanner.exe dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "Wi-Fi Beacon Scanner $tag" --notes-file release-notes.md --latest=false
          }
