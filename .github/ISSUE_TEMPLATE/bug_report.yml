name: Bug report / Ошибка
description: Something does not work as expected / Программа работает не так, как ожидалось
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Make sure screenshots and files contain no SSIDs or BSSIDs you are not allowed to share.
        Перед отправкой проверьте, что в скриншотах и файлах нет SSID и BSSID, которые нельзя показывать.
  - type: input
    id: version
    attributes:
      label: App version / Версия программы
      placeholder: "1.0.1 (View → About / Вид → О программе)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows and Wi-Fi adapter / Windows и адаптер Wi-Fi
      placeholder: "Windows 11 24H2, MediaTek Wi-Fi 6 MT7921"
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected / Что произошло и что ожидали
      description: Steps to reproduce / Шаги, чтобы повторить.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log / Журнал программы
      description: Last lines of `%LOCALAPPDATA%\WiFiBeaconScanner\logs\app.log` (View → About → Log folder).
      render: text
