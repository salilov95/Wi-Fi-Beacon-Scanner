name: Feature request / Предложение
description: A new feature or improvement / Новая возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve / Какую задачу это решает
      description: What you do now and what is inconvenient / Что вы делаете сейчас и что неудобно.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could look / Как это могло бы выглядеть
